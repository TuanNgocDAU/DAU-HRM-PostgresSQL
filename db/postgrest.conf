# ============================================================================
# Cấu hình PostgREST cho database "qlns" (PostgreSQL 18 local)
# ----------------------------------------------------------------------------
# PostgREST là lớp API HTTP đứng trước PostgreSQL - đúng công nghệ mà Supabase
# dùng bên trong. Nhờ nó, thư viện @supabase/supabase-js trong app hoạt động
# y hệt như khi nối cloud, chỉ khác là dữ liệu lấy từ máy local.
#
# CÁCH DÙNG:
#   1. Sửa mật khẩu trong db-uri bên dưới cho khớp role "authenticator"
#      (tạo bằng file setup-roles.sql).
#   2. Chạy:  postgrest.exe postgrest.conf
#      (hoặc dùng start-postgrest.bat)
# ============================================================================

# Chuỗi kết nối tới database qlns.
# Định dạng: postgres://<user>:<password>@<host>:<port>/<database>
# LƯU Ý: đổi "doi_mat_khau_o_day" thành mật khẩu bạn đặt cho role authenticator.
db-uri = "postgres://authenticator:1102@localhost:5432/qlns"

# Schema chứa các bảng (Users, DanhSachNhanVien, DanhMuc..., v.v.)
db-schemas = "public"

# Role mặc định dùng cho mọi request (app tự xử lý đăng nhập ở tầng ứng dụng,
# nên ở đây cấp quyền qua role web_anon - xem setup-roles.sql).
db-anon-role = "web_anon"

# Cổng PostgREST lắng nghe. Phải khớp POSTGREST_URL trong vite.config.ts (3001).
server-host = "127.0.0.1"
server-port = 3001

# Tự nạp lại schema khi có thay đổi cấu trúc bảng (tiện lúc phát triển).
db-channel-enabled = true

# KHÔNG đặt jwt-secret: mọi request chạy dưới quyền web_anon.
# LƯU Ý: supabase-js luôn gửi header "Authorization: Bearer <anon-key>" và
# "apikey". Nếu PostgREST nhận Authorization mà không có jwt-secret, nó sẽ báo
# lỗi "Server lacks JWT secret" (PGRST300). Vì vậy proxy trong vite.config.ts
# đã LOẠI BỎ 2 header này trước khi chuyển tiếp sang PostgREST.
